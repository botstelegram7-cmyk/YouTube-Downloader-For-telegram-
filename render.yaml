services:
  - type: web
    name: youtube-downloader-telegram
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DEFAULT_QUALITY
        value: 720p
      - key: DOWNLOAD_TIMEOUT
        value: "900"
      - key: LOG_LEVEL
        value: INFO
