# Render Blueprint — deploys the bot as a Docker web service.
#
# Dashboard → New → Blueprint → pick this repository. Render reads this file,
# builds the Dockerfile and gives you a public https URL, which the bot uses as
# its webhook (detected automatically from RENDER_EXTERNAL_URL).
#
# Note: on Render's free plan the service sleeps after 15 minutes without traffic;
# the first message after a quiet period waits ~30-60 s for the wake-up. A free
# uptime monitor pointed at /health keeps it warm — see docs/DEPLOYMENT.md.
services:
  - type: web
    name: youtube-telegram-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false          # set in the dashboard; never stored in git
      - key: WEBHOOK_SECRET
        generateValue: true  # Telegram echoes this back on every update
      - key: STARTUP_NOTIFY_CHAT_ID
        value: "0"           # send /id to the bot, then paste the chat id here
      - key: MAX_UPLOAD_MB
        value: "50"          # the ceiling of Telegram's cloud Bot API
      - key: MAX_CONCURRENT_JOBS
        value: "1"           # safe on a 512 MB instance
      - key: FRAGMENT_CONCURRENCY
        value: "4"
      - key: LOG_LEVEL
        value: INFO
      - key: DOWNLOAD_DIR
        value: /tmp/ytbot-downloads
