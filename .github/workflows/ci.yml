name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit tests and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r requirements-dev.txt ruff
          # The download engine, exactly as the Docker image installs it.
          npm install -g typetube@1.1.4
          node --version && typetube --version || true

      - name: Lint
        run: ruff check .

      - name: Static check (imports and syntax)
        run: python -m compileall -q config.py main.py bot

      - name: Unit tests
        run: pytest -q

      - name: Configuration pre-flight
        env:
          BOT_TOKEN: '123456789:placeholder-token-used-only-by-ci'
          WEBHOOK_URL: 'https://example.invalid'
          # Deliberately no API ID/hash: the check must also pass in the 50 MB configuration.
        run: python main.py --check

      - name: End-to-end pipeline (mock Bot API, stubbed engine, real FFmpeg)
        run: python scripts/e2e_local.py

      - name: Deploy regression — MTProto unreachable must not break the service
        # Reproduces the failed deploy: credentials are configured, the MTProto handshake
        # cannot complete, and the bot must still bind its port, answer /health, deliver
        # the file on the Bot API and shut down cleanly.
        run: python scripts/e2e_local.py --mtproto-unreachable

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t ytbot-test .

      - name: Validate the image (config, FFmpeg, Node, TypeTube)
        run: |
          docker run --rm \
            -e BOT_TOKEN=123456789:placeholder-token-used-only-by-ci \
            -e WEBHOOK_URL=https://example.invalid \
            ytbot-test python main.py --check

      - name: End-to-end check inside the image (FFmpeg, webhook, /health)
        run: |
          docker run --rm \
            -v "$PWD/scripts:/opt/scripts:ro" \
            -e PYTHONPATH=/app \
            -e YT_BOT_ROOT=/app \
            ytbot-test python /opt/scripts/e2e_local.py

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on whitespace errors anywhere in the tree
        # Diffing against the empty tree works in a shallow clone and checks the
        # whole repository, not just the last commit.
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Fail if a secret-looking file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|cookies\.txt$|(^|/)\.venv/'; then
            echo "::error::A secret-looking file is tracked in git"
            exit 1
          fi

      - name: Fail if generated files are tracked
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.pyc$|(^|/)downloads/|\.pytest_cache/'; then
            echo "::error::Generated files are tracked in git"
            exit 1
          fi

      - name: Fail if the serverless or Node-side JavaScript comes back
        # 3.0.0 removed the Serverless handlers and the Node worker on purpose. Node is
        # now an image dependency (it runs the TypeTube CLI), but no JavaScript source,
        # package manifest or vendored module belongs in this repository.
        run: |
          if git ls-files | grep -E '(^|/)tgcloud/|(^|/)worker/|(^|/)node_modules/|(^|/)package(-lock)?\.json$|tgcloud\.jsonc$|\.node-version$'; then
            echo "::error::The old Serverless/Node-side design is back in the repository"
            exit 1
          fi

      - name: Fail if yt-dlp comes back
        # The engine is TypeTube; a stray yt-dlp import or pin would silently revive the
        # old downloader. (xargs reports "no match" as exit 123, so the matched output is
        # what decides here, not the exit code.)
        run: |
          offenders=$(git ls-files -z '*.py' '*.txt' '*.toml' 'Dockerfile' \
            | xargs -0 grep -InE '(^|[^a-zA-Z_-])(yt_dlp|yt-dlp)([^a-zA-Z_-]|$)' 2>/dev/null || true)
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::yt-dlp is referenced again — the download engine is TypeTube"
            exit 1
          fi
          echo "no yt-dlp references in shipped code"

      - name: Fail on a committed bot token
        # Placeholders in the CI workflow and the e2e harness are deliberately
        # shaped like `123456789:placeholder-token-...` so they cannot match.
        run: |
          files=$(git ls-files || true)
          if [ -n "$files" ] && echo "$files" | xargs grep -InE '[0-9]{8,10}:AA[A-Za-z0-9_-]{33}' 2>/dev/null; then
            echo "::error::A bot-token-shaped string is committed"
            exit 1
          fi
