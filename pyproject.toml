[project]
name = "youtube-telegram-downloader"
version = "3.0.0"
description = "Telegram bot that downloads media with the TypeTube engine and delivers playable video"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the repository root importable so `pytest` works whether it is invoked as
# `pytest` or `python -m pytest`.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".git", "__pycache__", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # long lines are allowed in messages and docstrings
  "RUF001", # box-drawing characters are intentional in the UI copy
  "RUF002",
  "RUF003",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
